<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Slate-Forest Green) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050c0a" />
      <stop offset="100%" stop-color="#0c1714" />
    </linearGradient>
    <!-- Logo Accent Gradient (Mint to Emerald) -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <!-- Glowing Effect Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Panel (Clean Gradient with Rounded Borders) -->
  <rect width="600" height="200" rx="24" fill="url(#bg-grad)" stroke="#115e59" stroke-width="2"/>

  <!-- Centered Typography Group -->
  <g>
    <!-- Main Title "CO-RESOLVE" -->
    <text x="300" y="118" 
          text-anchor="middle"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="72" 
          letter-spacing="4">
      <tspan font-weight="900" fill="url(#accent-grad)" filter="url(#glow)">CO-</tspan>
      <tspan font-weight="300" fill="#f8fafc" letter-spacing="2">RESOLVE</tspan>
    </text>
          
    <!-- Decorative Separator Line -->
    <line x1="50" y1="142" x2="550" y2="142" stroke="#115e59" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Subtitle / Tagline -->
    <text x="300" y="168" 
          text-anchor="middle"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="17" 
          font-weight="700" 
          letter-spacing="7" 
          fill="#a7f3d0">CI/CD RESOLUTION AGENT</text>
  </g>
</svg>
